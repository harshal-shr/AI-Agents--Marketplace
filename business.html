    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            AI AgentHub
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="agents.html">AI Agents</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="business.html">Business</a>
                </li>

                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- HEADER -->
<section class="py-5 bg-light text-center">

    <div class="container">

        <h1 class="fw-bold">
            Business Automation Request
        </h1>

        <p class="text-muted">
            Tell us what your business needs to automate.
        </p>

    </div>

</section>


<!-- FORM -->
<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow-sm p-4">

                    <h3 class="mb-4">
                        Post Your Requirement
                    </h3>

                    <form id="requirementForm"
                          onsubmit="return submitRequirement()">

                        <!-- Business Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Business Name
                            </label>

                            <input type="text"
                                   id="businessName"
                                   class="form-control"
                                   placeholder="Enter business name">

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   id="businessEmail"
                                   class="form-control"
                                   placeholder="Enter email">

                        </div>


                        <!-- Automation Category -->
                        <div class="mb-3">

                            <label class="form-label">
                                Automation Category
                            </label>

                            <select id="automationCategory"
                                    class="form-select">

                                <option value="">
                                    Select category
                                </option>

                                <option value="Marketing">
                                    Marketing
                                </option>

                                <option value="Sales">
                                    Sales
                                </option>

                                <option value="Customer Support">
                                    Customer Support
                                </option>

                                <option value="Productivity">
                                    Productivity
                                </option>

                            </select>

                        </div>


                        <!-- Requirement -->
                        <div class="mb-3">

                            <label class="form-label">
                                Describe Your Requirement
                            </label>

                            <textarea id="requirement"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Describe the business problem you want to automate"></textarea>

                        </div>


                        <!-- Budget -->
                        <div class="mb-3">

                            <label class="form-label">
                                Estimated Budget
                            </label>

                            <input type="number"
                                   id="budget"
                                   class="form-control"
                                   placeholder="Enter budget in ₹">

                        </div>


                        <!-- Submit -->
                        <button type="submit"
                                class="btn btn-primary w-100">

                            Post Requirement

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4">

    <p class="mb-1">
        © 2026 AI AgentHub
    </p>

    <small>
        AI Agents Marketplace for Business Automation
    </small>

</footer>
