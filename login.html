<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI AgentHub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            AI AgentHub
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="agents.html">AI Agents</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="business.html">Business</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="developer.html">Developers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="login.html">Login</a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- LOGIN SECTION -->
<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-sm p-4">

                    <div class="text-center mb-4">

                        <div class="display-4">🔐</div>

                        <h2 class="fw-bold mt-2">
                            Welcome Back
                        </h2>

                        <p class="text-muted">
                            Login to your AI AgentHub account
                        </p>

                    </div>


                    <form onsubmit="return loginUser()">

                        <!-- USER TYPE -->
                        <div class="mb-3">

                            <label class="form-label">
                                Login As
                            </label>

                            <select id="userType"
                                    class="form-select">

                                <option value="">
                                    Select user type
                                </option>

                                <option value="Business Client">
                                    Business Client
                                </option>

                                <option value="AI Developer">
                                    AI Developer
                                </option>

                            </select>

                        </div>


                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   id="loginEmail"
                                   class="form-control"
                                   placeholder="Enter your email">

                        </div>


                        <!-- PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   id="loginPassword"
                                   class="form-control"
                                   placeholder="Enter your password">

                        </div>


                        <!-- REMEMBER -->
                        <div class="form-check mb-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="rememberMe">

                            <label class="form-check-label"
                                   for="rememberMe">

                                Remember me

                            </label>

                        </div>


                        <!-- LOGIN BUTTON -->
                        <button type="submit"
                                class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>


                    <hr class="my-4">


                    <div class="text-center">

                        <p class="mb-2">
                            Don't have an account?
                        </p>

                        <button class="btn btn-outline-primary"
                                onclick="showRegister()">

                            Create Account

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- REGISTER MODAL -->

<div class="modal fade"
     id="registerModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Create Account
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form onsubmit="return registerUser()">

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               id="registerName"
                               class="form-control"
                               placeholder="Enter your name">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="registerEmail"
                               class="form-control"
                               placeholder="Enter email">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Account Type
                        </label>

                        <select id="registerType"
                                class="form-select">

                            <option value="">
                                Select account type
                            </option>

                            <option value="Business Client">
                                Business Client
                            </option>

                            <option value="AI Developer">
                                AI Developer
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               id="registerPassword"
                               class="form-control"
                               placeholder="Create password">

                    </div>


                    <button type="submit"
                            class="btn btn-primary w-100">

                        Create Account

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4">

    <p class="mb-1">
        © 2026 AI AgentHub
    </p>

    <small>
        AI Agents Marketplace for Business Automation
    </small>

</footer>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Custom JS -->
<script src="script.js"></script>

</body>
</html>
